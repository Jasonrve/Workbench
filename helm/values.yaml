replicaCount: 1

image:
  repository: ghcr.io/jasonrve/workbench
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: "k8s-debugger"
  annotations: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: k8s-debugger.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

readOnly: false
awsRegion: "us-east-1"
